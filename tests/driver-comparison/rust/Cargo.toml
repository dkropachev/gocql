[package]
name = "driver-comparison-rust"
version = "0.1.0"
edition = "2024"
publish = false

# The scylla-rust-driver client of the driver comparison: the same cases,
# flags and JSON output as the Go clients (main.go).

[dependencies]
scylla = "=1.10.0"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
async-channel = "2"
hdrhistogram = "7"
sha2 = "0.10"
serde_json = "1"
libc = "0.2"
futures = "0.3"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
